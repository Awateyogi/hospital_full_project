<h2>Login</h2>

<div style="width:300px">
  <input
    [(ngModel)]="username"
    placeholder="Username"
  /><br /><br />

  <input
    [(ngModel)]="password"
    type="password"
    placeholder="Password"
  /><br /><br />

  <button (click)="login()">Login</button>

  <p style="color:red">{{ error }}</p>
</div>
